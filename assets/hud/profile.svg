<text x="42" y="107" class="pink" font-size="14">Infraestrutura • Linux • Windows • Automação</text>
<text x="42" y="139" class="body">+ Mais de 10 anos em infraestrutura e suporte técnico N1/N2/N3.</text>
<text x="42" y="163" class="body">+ Linux (Debian/Ubuntu), Windows Server e Active Directory.</text>
<text x="42" y="187" class="body">+ PowerShell, Shell, diagnóstico e proteção de drivers.</text>
<text x="42" y="211" class="body">+ Troubleshooting, documentação e análise de causa raiz (RCA).</text>
